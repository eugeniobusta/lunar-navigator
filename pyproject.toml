[project]
name = "lunar-navigator-engine"
version = "0.1.0"
description = "Precompute pipeline for the Lunar Landing Site Navigator (HackAthlone 2026)"
requires-python = ">=3.11"
dependencies = [
    "skyfield>=1.49",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
